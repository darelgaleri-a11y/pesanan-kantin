<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Sistem Pengelolaan Pesanan Kantin Santri"
  />

  <meta name="theme-color" content="#0D5C3A" />

  <title>Pesanan Kantin</title>

  <!-- Google Fonts dari desain Stitch -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Material Symbols dari desain Stitch -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  />

  <!-- Tailwind CDN dipakai sementara untuk kompatibilitas UI Stitch -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#004328",
            "primary-container": "#0D5C3A",

            secondary: "#904D00",
            "secondary-container": "#FE932C",

            tertiary: "#00328B",
            "tertiary-container": "#0046BC",

            surface: "#F8F9FF",
            "surface-container-lowest": "#FFFFFF",
            "surface-container-low": "#EFF4FF",
            "surface-container": "#E6EEFF",
            "surface-container-high": "#DCE9FF",
            "surface-container-highest": "#D5E3FC",

            "on-surface": "#0D1C2E",
            "on-surface-variant": "#404942",

            outline: "#707971",
            "outline-variant": "#BFC9C0",

            error: "#BA1A1A",

            "primary-fixed": "#A9F3C5",
            "on-primary-fixed": "#002111",

            "secondary-fixed": "#FFDCC3",
            "on-secondary-fixed": "#2F1500"
          },

          fontFamily: {
            jakarta: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="/src/styles/stitch.css" />
  <link rel="stylesheet" href="/src/styles/app.css" />
</head>

<body>
  <div id="app">
    <div class="app-loading">
      Memuat Pesanan Kantin...
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
